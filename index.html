<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuraTravel Maharashtra | AI Explorer</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav class="glass-nav">
            <div class="logo">Maharashtra<span>AI</span></div>

            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#destinations">Explore</a></li>
                <li><a href="#features">Features</a></li>
            </ul>

            <button class="btn-neon">Sign In</button>
        </nav>
    </header>

    <section class="hero" id="home">
        <div class="hero-content">

            <h1>Maharashtra, Reimagined by <span>Neural AI.</span></h1>

            <p>
                From Konkan coast to Sahyadri peaks,
                let our AI plan your perfect escape.
            </p>

            <div class="search-bar-ai">
                <input
                    type="text"
                    id="ai-input"
                    placeholder="Search 'Beaches', 'Forts', or 'Hill stations'..."
                >

                <button id="ai-btn" class="btn-neon">
                    <i class="fas fa-brain"></i> Analyze
                </button>
            </div>

            <div id="ai-loader" class="hidden">
                🤖 AI is scanning Sahyadri weather and traffic...
            </div>

            <div class="filter-container">
                <button class="pill" onclick="suggestByMood('all')">All</button>
                <button class="pill" onclick="suggestByMood('beach')">🏖️ Konkan</button>
                <button class="pill" onclick="suggestByMood('fort')">🚩 Forts</button>
                <button class="pill" onclick="suggestByMood('nature')">🌲 Hill Stations</button>
            </div>

        </div>
    </section>

    <section id="destinations" class="container">

        <h2 class="section-title">AI Curated For You</h2>

        <div class="grid-cards" id="dest-container"></div>

    </section>

    <!-- Modal -->
    <div id="booking-modal" class="modal">

        <div class="modal-content">

            <span class="close" onclick="toggleModal()">&times;</span>

            <h2 id="modal-title">Book Trip</h2>

            <p id="modal-desc">
                Plan optimized for best weather.
            </p>

            <form
                onsubmit="event.preventDefault();
                alert('AI Booking Confirmed! Check your email.');
                toggleModal();"
            >

                <input type="text" placeholder="Your Name" required>

                <input type="date" required>

                <input
                    type="number"
                    placeholder="Total Travelers"
                    min="1"
                    required
                >

                <button type="submit" class="btn-neon submit-btn">
                    Finalize Itinerary
                </button>

            </form>

        </div>

    </div>

    <!-- External JS -->
    <script src="script.js"></script>

</body>
</html>
